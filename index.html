<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Iron Log" />
<title>Iron Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
  :root {
    --ink: #17181A;
    --steel: #232628;
    --steel-light: #2E3234;
    --chalk: #EDEAE2;
    --chalk-dim: #93A19C;
    --line: #34393B;
    --font-display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--chalk); font-family: var(--font-body); }
  body { padding-bottom: env(safe-area-inset-bottom); }
  button { font-family: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 36px; }
  .header { padding: 22px 18px 14px; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-family: var(--font-display); font-size: 34px; letter-spacing: 1px; margin: 0; line-height: 1; }
  .pill-btn {
    display: flex; align-items: center; gap: 6px; background: var(--steel); border: 1px solid var(--line);
    border-radius: 20px; padding: 7px 12px; color: var(--chalk); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .tabs { display: flex; gap: 8px; padding: 0 18px 16px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; text-align: left; padding: 10px 14px; border-radius: 12px; cursor: pointer;
    background: var(--steel); border: 1.5px solid var(--line);
  }
  .tab.active { background: color-mix(in srgb, var(--accent) 12%, var(--steel)); border-color: var(--accent); }
  .tab-label { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.5px; line-height: 1; color: var(--chalk); }
  .tab.active .tab-label { color: var(--accent); }
  .tab-sub { font-size: 10.5px; color: var(--chalk-dim); font-family: var(--font-mono); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .content { padding: 0 18px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--steel); border-radius: 14px; border: 1px solid var(--line); }
  .collapse-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
    background: none; border: none; color: var(--chalk); cursor: pointer;
  }
  .section-title { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.5px; }
  .chev { transition: transform .2s; color: var(--chalk-dim); }
  .chev.open { transform: rotate(180deg); }
  .warmup-list { margin: 0; padding: 0 16px 16px 32px; color: var(--chalk-dim); font-size: 13.5px; line-height: 1.9; }
  .active-title { font-family: var(--font-display); font-size: 19px; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .active-title .sub { color: var(--chalk-dim); font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .ex-list { display: flex; flex-direction: column; gap: 12px; }
  .ex-card { background: var(--steel); border-radius: 14px; border: 1px solid var(--line); padding: 14px; }
  .ex-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .ex-name { font-size: 15.5px; font-weight: 700; }
  .ex-note { font-size: 11.5px; color: var(--chalk-dim); margin-top: 1px; }
  .ex-target { font-family: var(--font-mono); font-size: 12px; color: var(--chalk-dim); white-space: nowrap; margin-left: 10px; }
  .sub-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .bar-row { display: flex; align-items: center; gap: 3px; height: 18px; }
  .bar-cap { width: 8px; height: 3px; background: var(--line); border-radius: 1px; }
  .bar-track { flex: 1; height: 3px; background: var(--line); border-radius: 1px; display: flex; align-items: center; gap: 4px; padding-left: 2px; }
  .plate { width: 10px; border-radius: 2px; transition: all .25s ease; }
  .set-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .set-row { display: flex; align-items: center; gap: 8px; }
  .set-idx { width: 18px; font-family: var(--font-mono); font-size: 12px; color: var(--chalk-dim); }
  .num-input {
    width: 100%; background: var(--steel-light); border: 1px solid var(--line); border-radius: 8px; color: var(--chalk);
    font-family: var(--font-mono); font-weight: 700; font-size: 16px; padding: 10px 6px; text-align: center; outline: none;
  }
  .num-input::placeholder { color: var(--chalk-dim); opacity: .55; font-weight: 500; }
  .x-sep { color: var(--chalk-dim); font-size: 12px; }
  .core-row { display: flex; align-items: center; gap: 10px; }
  .core-check {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; border: 1.5px solid var(--line);
    background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .core-check.done { background: var(--accent); border-color: var(--accent); }
  .core-label { flex: 1; font-size: 14px; }
  .core-label.done { color: var(--chalk-dim); text-decoration: line-through; }
  .stretch-note { text-align: center; color: var(--chalk-dim); font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 1px; padding: 4px 0 8px; }
  .footer-actions { display: flex; gap: 8px; margin-top: 4px; }
  .footer-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--steel);
    border: 1px solid var(--line); color: var(--chalk); border-radius: 10px; padding: 10px; font-size: 12.5px;
    font-weight: 600; cursor: pointer;
  }
  .finish-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none; background: var(--accent); color: #101112;
    font-family: var(--font-display); font-size: 19px; letter-spacing: 1px; cursor: pointer;
  }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--steel-light);
    border: 1px solid var(--line); color: var(--chalk); padding: 10px 18px; border-radius: 10px; font-size: 13.5px;
    font-weight: 600; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .modal-bg {
    position: fixed; inset: 0; background: #000000AA; display: none; align-items: center; justify-content: center;
    z-index: 60; padding: 24px;
  }
  .modal-bg.show { display: flex; }
  .modal { background: var(--steel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; max-width: 340px; }
  .modal h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 8px; font-weight: normal; }
  .modal p { color: var(--chalk-dim); font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; }
  .modal-actions { display: flex; gap: 8px; }
  .hist-empty { padding: 40px 24px; text-align: center; color: var(--chalk-dim); }
  .hist-empty .big { font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; color: var(--chalk); }
  .hist-item { position: relative; border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .hist-action-notes {
    position: absolute; top: 0; right: 0; bottom: 0; width: 72px; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: #101112; font-size: 11px; font-weight: 700; font-family: var(--font-body);
  }
  .hist-front { position: relative; background: var(--steel); border: 1px solid var(--line); border-radius: 14px; will-change: transform; }
  .hist-header { display: flex; align-items: center; }
  .hist-btn { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: none; border: none; color: var(--chalk); cursor: pointer; text-align: left; }
  .hist-delete { flex-shrink: 0; width: 34px; height: 34px; margin-right: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--steel-light); color: var(--chalk-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .hist-delete:active { color: #B4423A; border-color: #B4423A; }
  .hist-day { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.5px; }
  .hist-meta { font-size: 11.5px; color: var(--chalk-dim); font-family: var(--font-mono); margin-top: 2px; }
  .hist-body { padding: 0 16px 16px; }
  .hist-ex { font-size: 13px; margin-bottom: 4px; }
  .hist-ex .lbl { color: var(--chalk-dim); }
  .hist-ex .val { font-family: var(--font-mono); }
  .hist-notes-panel { padding: 0 16px 16px; }
  .notes-textarea {
    width: 100%; min-height: 70px; background: var(--steel-light); border: 1px solid var(--line); border-radius: 10px;
    color: var(--chalk); font-family: var(--font-body); font-size: 13.5px; padding: 10px; resize: vertical; outline: none;
  }
  .notes-textarea::placeholder { color: var(--chalk-dim); opacity: .6; }
  .swipe-hint { text-align: center; color: var(--chalk-dim); font-size: 11px; font-family: var(--font-mono); padding: 2px 0 10px; opacity: .7; }
  .warn { color: #D98B3B; font-size: 11.5px; margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ---------------------------------------------------------------
   WORKOUT DATA
--------------------------------------------------------------- */
const DAYS = [
  {
    id: "day1", label: "Day 1", intensity: "Push", accent: "#B4423A",
    rest: "1.5m rest",
    warmup: ["Cat Cow x10","Banded Leg Bends x10/side","Inner thigh push / pull x10","Outer glute stretch x10/side","Lunge push / pull x10/side","Thread the needle x10/side","5-10 min Row or Treadmill Walk"],
    exercises: [
      { id:"d1e1", name:"BB Back Squats", note:"or Leg Press", sets:4, reps:"6-8", subExercises:[{id:"d1e1a",name:"BB Back Squats"}] },
      { id:"d1e2", name:"BB Flat Chest Press", sets:4, reps:"6-8", subExercises:[{id:"d1e2a",name:"BB Flat Chest Press"}] },
      { id:"d1e6", name:"Leg Press", sets:3, reps:"8-10", subExercises:[{id:"d1e6a",name:"Leg Press"}] },
      { id:"d1e3", name:"DB Incline Chest Press", note:"or Overhead Press, Dips, Cable Flyes", sets:3, reps:"10-12", subExercises:[{id:"d1e3a",name:"DB Incline Chest Press"}] },
      { id:"d1e7", name:"Leg Extensions", sets:3, reps:"10-12", subExercises:[{id:"d1e7a",name:"Leg Extensions"}] },
      { id:"d1e5", name:"Skull Crushers", note:"or Tricep Pulldown Machine", sets:3, reps:"10-12", subExercises:[{id:"d1e5a",name:"Skull Crushers"}] },
    ],
  },
  {
    id: "day2", label: "Day 2", intensity: "Pull", accent: "#3B7FC4",
    rest: "1.5m rest",
    warmup: ["Cat Cow x10","Banded Leg Bends x10/side","Inner thigh push / pull x10","Outer glute stretch x10/side","Lunge push / pull x10/side","Thread the needle x10/side","5-10 min Row or Treadmill Walk"],
    exercises: [
      { id:"d2e1", name:"Deadlifts", sets:4, reps:"6-8", subExercises:[{id:"d2e1a",name:"Deadlifts"}] },
      { id:"d2e2", name:"Seated Rows", note:"switch grips", sets:4, reps:"8-10", subExercises:[{id:"d2e2a",name:"Seated Rows"}] },
      { id:"d2e7", name:"Leg Curls", sets:3, reps:"10-12", subExercises:[{id:"d2e7a",name:"Leg Curls"}] },
      { id:"d2e3", name:"Lat Pulldowns", note:"switch grips", sets:3, reps:"8-10", subExercises:[{id:"d2e3a",name:"Lat Pulldowns"}] },
      { id:"d2e5", name:"Concentration Curls", note:"or 3x 21s", sets:3, reps:"10-12", subExercises:[{id:"d2e5a",name:"Concentration Curls"}] },
      { id:"d2e6", name:"Reverse Flyes", note:"or Face Pulls", sets:3, reps:"10-12", subExercises:[{id:"d2e6a",name:"Reverse Flyes"}] },
    ],
  },
  {
    id: "day3", label: "Day 3", intensity: "Fill", accent: "#D9A233",
    rest: "1.5m rest",
    warmup: ["Cat Cow x10","Banded Leg Bends x10/side","Inner thigh push / pull x10","Outer glute stretch x10/side","Lunge push / pull x10/side","Thread the needle x10/side","5-10 min Row or Treadmill Walk"],
    exercises: [
      { id:"d3e1", name:"DB Shrugs", sets:4, reps:"6-8", subExercises:[{id:"d3e1a",name:"DB Shrugs"}] },
      { id:"d3e2", name:"DB Wide Stance Goblet Squat", sets:4, reps:"6-8", subExercises:[{id:"d3e2a",name:"DB Goblet Squat"}] },
      { id:"d3e3", name:"DB Lateral Raises", sets:3, reps:"10-12", subExercises:[{id:"d3e3a",name:"DB Lateral Raises"}] },
      { id:"d3e8", name:"Lunges", note:"or Single Leg Press", sets:3, reps:"8-12", subExercises:[{id:"d3e8a",name:"Lunges"}] },
      { id:"d3e5", name:"BB Upright Row", sets:3, reps:"10-12", subExercises:[{id:"d3e5a",name:"BB Upright Row"}] },
      { id:"d3e6", name:"Calf Raises", note:"alternate internal & external rotation", sets:4, reps:"10-12", subExercises:[{id:"d3e6a",name:"Calf Raises"}] },
      { id:"d3e7", name:"Farmers Walk", note:"1 side there, other side back · heavy as you can", sets:2, reps:"", subExercises:[{id:"d3e7a",name:"Farmers Walk"}] },
    ],
  },
];

// Names for exercises that have been retired from the active plan, so old
// history entries that reference them still display a proper label.
const LEGACY_EXERCISE_NAMES = {
  d1e4a: "Lunges",
  d2e4a: "Leg Extension (old)",
  d3e4a: "DB Sumo Squat",
};

const CORE_FINISHER = ["Crunches","Reverse crunches","Oblique heel taps","Side crunches","Plank rotations","Plank","Seated twists","Mountain climbers"];
const STORAGE_KEY = "iron-log-data-v2";

/* ---------------------------------------------------------------
   ICONS (tiny inline SVGs, no external deps)
--------------------------------------------------------------- */
const ICONS = {
  history: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>`,
  close: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>`,
  chev: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`,
  check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#101112" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  flame: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
  download: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  reset: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
  trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`,
  note: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
  upload: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
};

/* ---------------------------------------------------------------
   STATE
--------------------------------------------------------------- */
function emptyDraftExercises(day){
  const ex = {};
  day.exercises.forEach(e => e.subExercises.forEach(s => {
    ex[s.id] = Array.from({length: e.sets}, () => ({weight:"", reps:""}));
  }));
  return ex;
}
function emptyCore(){
  const c = {};
  CORE_FINISHER.forEach(name => c[name] = {done:false, reps:""});
  return c;
}
function freshDraft(day){
  return { exercises: emptyDraftExercises(day), core: emptyCore(), notes: "", startedAt: new Date().toISOString() };
}
function reconcileDraft(day, draft){
  const fresh = emptyDraftExercises(day);
  const exercises = {};
  Object.keys(fresh).forEach(subId => {
    exercises[subId] = (draft && draft.exercises && draft.exercises[subId]) || fresh[subId];
  });
  const core = { ...emptyCore(), ...((draft && draft.core) || {}) };
  return { exercises, core, notes: (draft && draft.notes) || "", startedAt: (draft && draft.startedAt) || new Date().toISOString() };
}

let storageOK = true;
let state = {
  history: [],
  drafts: {},
  selectedDay: "day1",
  view: "workout",
  warmupOpen: false,
  confirm: null, // { type: 'finish' | 'reset' | 'deleteSession', id? }
};
DAYS.forEach(d => state.drafts[d.id] = freshDraft(d));

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.history) state.history = parsed.history;
      if (parsed.drafts) {
        DAYS.forEach(d => { state.drafts[d.id] = parsed.drafts[d.id] ? reconcileDraft(d, parsed.drafts[d.id]) : freshDraft(d); });
      }
    }
    storageOK = true;
  } catch (err) {
    console.log("Could not read local storage, starting fresh.", err);
    storageOK = false;
  }
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({history: state.history, drafts: state.drafts}));
    storageOK = true;
  } catch (err) {
    console.error("Could not write local storage", err);
    storageOK = false;
  }
}

function getLastSession(dayId){
  const sessions = state.history.filter(h => h.dayId === dayId).sort((a,b) => new Date(b.date) - new Date(a.date));
  return sessions[0] || null;
}
function lastValueFor(dayId, subId, idx){
  const last = getLastSession(dayId);
  if (!last || !last.exercises[subId] || !last.exercises[subId][idx]) return null;
  const s = last.exercises[subId][idx];
  if (s.weight === "" && s.reps === "") return null;
  return s;
}

function exerciseNameFor(day, session, subId){
  if (session.meta && session.meta[subId]) return session.meta[subId].name;
  for (const ex of day.exercises) {
    const sub = ex.subExercises.find(s => s.id === subId);
    if (sub) return sub.name;
  }
  if (LEGACY_EXERCISE_NAMES[subId]) return LEGACY_EXERCISE_NAMES[subId];
  return subId;
}

/* ---------------------------------------------------------------
   RENDER
--------------------------------------------------------------- */
const root = document.getElementById("root");
let toastTimer = null;

function showToast(msg){
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function currentDay(){ return DAYS.find(d => d.id === state.selectedDay); }

function renderApp(){
  const day = currentDay();
  root.innerHTML = `
    <div class="wrap" style="--accent:${day.accent}">
      <div class="header">
        <div class="header-row">
          <h1>IRON&nbsp;LOG</h1>
          <button class="pill-btn" id="viewToggle">${state.view === "workout" ? ICONS.history + " History" : ICONS.close + " Close"}</button>
        </div>
        ${!storageOK ? `<p class="warn">⚠ Couldn't access local storage — your data will only last this session. Use Export to save a backup.</p>` : ""}
      </div>
      ${state.view === "workout" ? renderWorkoutView(day) : renderHistoryView()}
    </div>
    <div class="toast" id="toast"></div>
    ${renderConfirmModal(day)}
  `;
  attachListeners(day);
}

function confirmModalContent(){
  const c = state.confirm;
  if (!c) return null;
  if (c.type === "finish") return { title: "Save this workout?", message: "This logs today's sets to history and clears the draft for next time.", confirmLabel: "Save Workout", danger: false };
  if (c.type === "reset") return { title: "Clear everything?", message: "This permanently deletes all logged sets and history. Consider exporting first.", confirmLabel: "Delete Everything", danger: true };
  if (c.type === "deleteSession") return { title: "Delete this session?", message: "This permanently removes this logged workout from history. It can't be undone.", confirmLabel: "Delete Session", danger: true };
  return null;
}

function renderConfirmModal(day){
  const info = confirmModalContent();
  if (!info) return `<div class="modal-bg" id="modalBg"></div>`;
  return `
    <div class="modal-bg show" id="modalBg">
      <div class="modal">
        <h2>${info.title}</h2>
        <p>${info.message}</p>
        <div class="modal-actions">
          <button class="footer-btn" id="cancelConfirm">Cancel</button>
          <button class="footer-btn" id="confirmActionBtn" style="background:${info.danger ? "#B4423A" : day.accent};color:${info.danger ? "#fff" : "#101112"};border:none;">${info.confirmLabel}</button>
        </div>
      </div>
    </div>
  `;
}

function renderWorkoutView(day){
  return `
    <div class="tabs">
      ${DAYS.map(d => `
        <div class="tab ${d.id === state.selectedDay ? "active" : ""}" data-day="${d.id}" style="--accent:${d.accent}">
          <div class="tab-label">${d.label}</div>
          <div class="tab-sub">${d.intensity}</div>
        </div>
      `).join("")}
    </div>
    <div class="content">
      <div class="card">
        <button class="collapse-btn" id="warmupToggle">
          <span class="section-title">WARM UP</span>
          <span class="chev ${state.warmupOpen ? "open" : ""}">${ICONS.chev}</span>
        </button>
        ${state.warmupOpen ? `<ul class="warmup-list">${day.warmup.map(w => `<li>${w}</li>`).join("")}</ul>` : ""}
      </div>

      <div>
        <div class="active-title" style="color:${day.accent}">${ICONS.flame} ACTIVE SETS <span class="sub">· ${day.rest}</span></div>
        <div class="ex-list">
          ${day.exercises.map(ex => renderExerciseCard(ex, day)).join("")}
        </div>
      </div>

      <div class="card" style="padding:16px;">
        <div class="section-title" style="margin-bottom:10px;">CORE FINISHER <span style="color:var(--chalk-dim);font-family:var(--font-mono);font-size:11px;font-weight:500;">· 5m</span></div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${CORE_FINISHER.map(name => renderCoreRow(name, day)).join("")}
        </div>
      </div>

      <div class="stretch-note">· · · STRETCH · · ·</div>

      <div class="card" style="padding:16px;">
        <div class="section-title" style="margin-bottom:10px;">NOTES</div>
        <textarea class="notes-textarea" id="todayNotes" placeholder="How'd it feel? Anything to remember for next time...">${state.drafts[state.selectedDay].notes || ""}</textarea>
      </div>

      <div class="footer-actions">
        <button class="footer-btn" id="exportBtn">${ICONS.download} Export</button>
        <button class="footer-btn" id="importBtn">${ICONS.upload} Import</button>
        <button class="footer-btn" id="resetBtn">${ICONS.reset} Reset</button>
      </div>

      <button class="finish-btn" id="finishBtn" style="background:${day.accent};margin-top:6px;">FINISH &amp; SAVE WORKOUT</button>
    </div>
  `;
}

function renderExerciseCard(ex, day){
  const draft = state.drafts[state.selectedDay].exercises;
  return `
    <div class="ex-card" style="border-left:3px solid ${day.accent}">
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ""}
        </div>
        <div class="ex-target">${ex.reps ? `${ex.sets}×${ex.reps}` : `${ex.sets} sets`}</div>
      </div>
      ${ex.subExercises.map(sub => renderSubExercise(sub, ex, day, draft)).join("")}
    </div>
  `;
}

function renderSubExercise(sub, ex, day, draft){
  const sets = draft[sub.id] || [];
  const completed = sets.filter(s => s.weight !== "" && s.reps !== "").length;
  return `
    <div style="margin-bottom:10px;">
      ${ex.isSuperset ? `<div class="sub-name" style="color:${day.accent}">${sub.name}</div>` : ""}
      <div class="bar-row" id="bar-${sub.id}">${renderBar(sets.length, completed, day.accent)}</div>
      <div class="set-rows">
        ${sets.map((s, idx) => {
          const last = lastValueFor(day.id, sub.id, idx);
          return `
            <div class="set-row">
              <span class="set-idx">${idx+1}</span>
              <input class="num-input" type="text" inputmode="decimal" data-sub="${sub.id}" data-idx="${idx}" data-field="weight"
                placeholder="${last ? last.weight : 'lb'}" value="${s.weight}" />
              <span class="x-sep">×</span>
              <input class="num-input" type="text" inputmode="numeric" data-sub="${sub.id}" data-idx="${idx}" data-field="reps"
                placeholder="${last ? last.reps : (ex.reps || 'reps')}" value="${s.reps}" />
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function renderBar(total, completed, accent){
  return `
    <div class="bar-cap"></div>
    <div class="bar-track">
      ${Array.from({length: total}).map((_, i) => `
        <div class="plate" style="height:${i < completed ? 18 : 10}px;background:${i < completed ? accent : 'var(--line)'};opacity:${i < completed ? 1 : 0.5}"></div>
      `).join("")}
    </div>
    <div class="bar-cap"></div>
  `;
}

function renderCoreRow(name, day){
  const item = state.drafts[state.selectedDay].core[name];
  return `
    <div class="core-row">
      <button class="core-check ${item.done ? 'done' : ''}" data-core="${name}" style="${item.done ? `background:${day.accent};border-color:${day.accent}` : ''}">
        ${item.done ? ICONS.check : ""}
      </button>
      <span class="core-label ${item.done ? 'done' : ''}">${name}</span>
      <input class="num-input" style="width:56px;padding:6px 4px;font-size:13px;" placeholder="reps" inputmode="numeric" data-corereps="${name}" value="${item.reps}" />
    </div>
  `;
}

function renderHistoryView(){
  if (state.history.length === 0) {
    return `<div class="hist-empty"><div class="big">No sessions yet</div><p>Finish a workout and it'll show up here.</p></div>`;
  }
  return `<div class="content"><div class="swipe-hint">← swipe a workout for notes</div>${state.history.map(session => renderHistItem(session)).join("")}</div>`;
}

function renderHistItem(session){
  const day = DAYS.find(d => d.id === session.dayId);
  const dateStr = new Date(session.date).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
  const setCount = Object.values(session.exercises).reduce((acc, arr) => acc + arr.filter(s => s.weight !== "" || s.reps !== "").length, 0);
  const open = session._open;
  const swiped = session._swiped;
  const notesOpen = session._notesOpen;
  const hasNotes = session.notes && session.notes.trim() !== "";
  return `
    <div class="hist-item">
      <button class="hist-action-notes" data-notesbtn="${session.id}" style="background:${day.accent}">
        ${ICONS.note}<span>Notes</span>
      </button>
      <div class="hist-front" data-session="${session.id}" style="border-left:3px solid ${day.accent};transform:translateX(${swiped ? "-72px" : "0"})">
        <div class="hist-header">
          <button class="hist-btn" data-hist="${session.id}">
            <div>
              <div class="hist-day">${day.label} · ${day.intensity}</div>
              <div class="hist-meta">${dateStr} · ${setCount} sets logged${hasNotes ? " · has notes" : ""}</div>
            </div>
            <span class="chev ${open ? "open" : ""}">${ICONS.chev}</span>
          </button>
          <button class="hist-delete" data-delhist="${session.id}" aria-label="Delete session">${ICONS.trash}</button>
        </div>
        ${open ? `
          <div class="hist-body">
            ${Object.keys(session.exercises).map(subId => {
              const sets = session.exercises[subId] || [];
              const logged = sets.filter(s => s.weight !== "" || s.reps !== "");
              if (logged.length === 0) return "";
              const name = exerciseNameFor(day, session, subId);
              return `<div class="hist-ex"><span class="lbl">${name}: </span><span class="val">${logged.map(s => `${s.weight || "–"}×${s.reps || "–"}`).join(",  ")}</span></div>`;
            }).join("")}
          </div>
        ` : ""}
        ${notesOpen ? `
          <div class="hist-notes-panel">
            <textarea class="notes-textarea" data-notesfor="${session.id}" placeholder="Add notes for this workout...">${session.notes || ""}</textarea>
          </div>
        ` : ""}
      </div>
    </div>
  `;
}

/* ---------------------------------------------------------------
   EVENTS
--------------------------------------------------------------- */
function attachListeners(day){
  const viewToggle = document.getElementById("viewToggle");
  if (viewToggle) viewToggle.onclick = () => { state.view = state.view === "workout" ? "history" : "workout"; renderApp(); };

  document.querySelectorAll(".tab").forEach(el => {
    el.onclick = () => { state.selectedDay = el.dataset.day; renderApp(); };
  });

  const warmupToggle = document.getElementById("warmupToggle");
  if (warmupToggle) warmupToggle.onclick = () => { state.warmupOpen = !state.warmupOpen; renderApp(); };

  // weight/reps inputs — update state + save + patch just the bar, no full re-render (keeps keyboard focus)
  document.querySelectorAll(".num-input[data-sub]").forEach(inp => {
    inp.addEventListener("input", () => {
      const subId = inp.dataset.sub, idx = +inp.dataset.idx, field = inp.dataset.field;
      let val = inp.value;
      val = field === "weight" ? val.replace(/[^0-9.]/g, "") : val.replace(/[^0-9]/g, "");
      inp.value = val;
      state.drafts[state.selectedDay].exercises[subId][idx][field] = val;
      saveState();
      const sets = state.drafts[state.selectedDay].exercises[subId];
      const completed = sets.filter(s => s.weight !== "" && s.reps !== "").length;
      const barEl = document.getElementById(`bar-${subId}`);
      if (barEl) barEl.innerHTML = renderBar(sets.length, completed, day.accent);
    });
  });

  document.querySelectorAll(".core-check").forEach(btn => {
    btn.onclick = () => {
      const name = btn.dataset.core;
      const core = state.drafts[state.selectedDay].core[name];
      core.done = !core.done;
      saveState();
      renderApp();
    };
  });

  document.querySelectorAll(".num-input[data-corereps]").forEach(inp => {
    inp.addEventListener("input", () => {
      const name = inp.dataset.corereps;
      const val = inp.value.replace(/[^0-9]/g, "");
      inp.value = val;
      state.drafts[state.selectedDay].core[name].reps = val;
      saveState();
    });
  });

  const todayNotes = document.getElementById("todayNotes");
  if (todayNotes) {
    todayNotes.addEventListener("input", () => {
      state.drafts[state.selectedDay].notes = todayNotes.value;
      saveState();
    });
  }

  const importBtn = document.getElementById("importBtn");
  if (importBtn) importBtn.onclick = () => { const inp = document.getElementById("importFile"); if (inp) { inp.value = ""; inp.click(); } };

  const finishBtn = document.getElementById("finishBtn");
  if (finishBtn) finishBtn.onclick = requestFinish;

  const exportBtn = document.getElementById("exportBtn");
  if (exportBtn) exportBtn.onclick = exportData;

  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.onclick = () => { state.confirm = {type: "reset"}; renderApp(); };

  const cancelConfirm = document.getElementById("cancelConfirm");
  if (cancelConfirm) cancelConfirm.onclick = () => { state.confirm = null; renderApp(); };

  const confirmActionBtn = document.getElementById("confirmActionBtn");
  if (confirmActionBtn) confirmActionBtn.onclick = runConfirmedAction;

  document.querySelectorAll(".hist-btn").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.hist;
      const session = state.history.find(s => s.id === id);
      if (session._swiped) { session._swiped = false; renderApp(); return; }
      session._open = !session._open;
      renderApp();
    };
  });

  document.querySelectorAll(".hist-delete").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      state.confirm = {type: "deleteSession", id: btn.dataset.delhist};
      renderApp();
    };
  });

  document.querySelectorAll(".hist-action-notes").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.notesbtn;
      const session = state.history.find(s => s.id === id);
      session._notesOpen = !session._notesOpen;
      session._swiped = false;
      renderApp();
    };
  });

  document.querySelectorAll(".notes-textarea[data-notesfor]").forEach(ta => {
    ta.addEventListener("input", () => {
      const id = ta.dataset.notesfor;
      const session = state.history.find(s => s.id === id);
      session.notes = ta.value;
      saveState();
    });
  });

  attachSwipeHandlers();
}

/* Swipe-left-to-reveal-notes gesture for history items (touch only) */
let swipeDrag = { id: null, startX: 0, currentX: 0, active: false };

function attachSwipeHandlers(){
  document.querySelectorAll(".hist-front").forEach(el => {
    const id = el.dataset.session;
    el.addEventListener("touchstart", (e) => {
      swipeDrag = { id, startX: e.touches[0].clientX, currentX: 0, active: true };
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (!swipeDrag.active || swipeDrag.id !== id) return;
      const dx = e.touches[0].clientX - swipeDrag.startX;
      swipeDrag.currentX = dx;
      const clamped = Math.max(-72, Math.min(0, dx));
      el.style.transition = "none";
      el.style.transform = `translateX(${clamped}px)`;
    }, { passive: true });
    el.addEventListener("touchend", () => {
      if (!swipeDrag.active || swipeDrag.id !== id) return;
      swipeDrag.active = false;
      el.style.transition = "";
      const session = state.history.find(s => s.id === id);
      const shouldOpen = swipeDrag.currentX < -36;
      if (session) session._swiped = shouldOpen;
      el.style.transform = shouldOpen ? "translateX(-72px)" : "translateX(0)";
    });
  });
}

function runConfirmedAction(){
  const c = state.confirm;
  if (!c) return;
  if (c.type === "finish") doFinishWorkout();
  else if (c.type === "reset") resetAll();
  else if (c.type === "deleteSession") deleteSession(c.id);
}

function loggedSetCount(){
  const d = state.drafts[state.selectedDay];
  let count = 0;
  Object.values(d.exercises).forEach(sets => sets.forEach(s => { if (s.weight !== "" || s.reps !== "") count++; }));
  return count;
}

function requestFinish(){
  const d = state.drafts[state.selectedDay];
  const hasData = loggedSetCount() > 0 || Object.values(d.core).some(c => c.done || c.reps !== "");
  if (!hasData) { showToast("Log at least one set first"); return; }
  state.confirm = {type: "finish"};
  renderApp();
}

function doFinishWorkout(){
  const d = state.drafts[state.selectedDay];
  const day = currentDay();
  const meta = {};
  day.exercises.forEach(ex => ex.subExercises.forEach(sub => {
    meta[sub.id] = { name: sub.name, exerciseName: ex.name };
  }));
  const session = {
    id: `${state.selectedDay}-${Date.now()}`,
    dayId: state.selectedDay,
    date: new Date().toISOString(),
    exercises: d.exercises,
    core: d.core,
    notes: d.notes || "",
    meta,
  };
  state.history.unshift(session);
  state.drafts[state.selectedDay] = freshDraft(day);
  state.confirm = null;
  saveState();
  renderApp();
  showToast("Workout saved ✓");
}

function deleteSession(id){
  state.history = state.history.filter(s => s.id !== id);
  state.confirm = null;
  saveState();
  renderApp();
  showToast("Session deleted");
}

function exportData(){
  const payload = JSON.stringify({history: state.history, drafts: state.drafts}, null, 2);
  const blob = new Blob([payload], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `workout-log-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed.history) ? parsed.history : [];
      if (incoming.length === 0) { showToast("No sessions found in that file"); return; }
      const existingIds = new Set(state.history.map(s => s.id));
      let added = 0;
      incoming.forEach(session => {
        if (session && session.id && !existingIds.has(session.id)) {
          state.history.push(session);
          existingIds.add(session.id);
          added++;
        }
      });
      state.history.sort((a, b) => new Date(b.date) - new Date(a.date));
      saveState();
      renderApp();
      showToast(added > 0 ? `Imported ${added} workout${added === 1 ? "" : "s"}` : "Nothing new to import");
    } catch (err) {
      console.error("Import failed", err);
      showToast("Couldn't read that file — is it an Iron Log export?");
    }
  };
  reader.readAsText(file);
}

function resetAll(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(err) { console.log(err); }
  state.history = [];
  DAYS.forEach(d => state.drafts[d.id] = freshDraft(d));
  state.confirm = null;
  renderApp();
  showToast("All data cleared");
}

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
loadState();
renderApp();
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  if (file) importData(file);
});
</script>
